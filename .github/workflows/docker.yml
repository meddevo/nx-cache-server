name: Build and push image

on:
  push:
    branches: [master, meddevo-integration]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/meddevo/nx-cache-server

permissions:
  contents: read
  packages: write

# A release push updates two refs (master + the vX.Y.Z tag), each firing this
# workflow for the same commit. Keying the group on the SHA puts both runs in
# one group; cancel-in-progress means the second (the tag, always pushed after
# master) supersedes the first, so a release builds once and publishes :X.Y.Z.
# Non-release master pushes are the only run in their group and are unaffected.
concurrency:
  group: docker-${{ github.sha }}
  cancel-in-progress: true

jobs:
  docker:
    # arm64 runner so the only image we ship is built natively. Previously this
    # ran on ubuntu-latest (amd64) and produced linux/amd64,linux/arm64, which
    # meant the arm64 half went through QEMU: ~40min per release, for one image
    # nothing pulls and one that is emulated. Hosted arm runners are free on
    # public repos (release.yml already uses this label).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # No setup-qemu-action: the runner is the target architecture.
      - uses: docker/setup-buildx-action@v4

      # PRs from forks can't push to GHCR; only log in / push on our own refs.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 only: every consumer is ARM64 Fargate (all three aws-infra
          # stacks set cpuArchitecture ARM64, and only dev runs this service) and
          # local work is on Apple Silicon. Stated explicitly rather than left to
          # the runner's native arch, so moving this job back to an amd64 runner
          # can't silently publish an image the task definition can't run.
          # Re-add linux/amd64 here if an x86 consumer ever appears.
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
