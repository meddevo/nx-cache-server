name: Test

on:
  push:
    branches: [master, meddevo-integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Same arm64 runner as docker.yml, for the same reason: free on public repos,
    # and it's the architecture the image actually ships for.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # Pinned explicitly rather than using whatever the runner image happens to
      # ship, so a runner-image bump can't quietly change what we test against.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The AWS SDK is nearly all of the build; without this every run spends
      # ~2min recompiling dependencies that never changed.
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Unit tests only - no AWS credentials or network needed. The one test that
      # opens a socket binds 127.0.0.1:0.
      - run: cargo test
